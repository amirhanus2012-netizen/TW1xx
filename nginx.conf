# ==============================================================================
# NEXUS VR - NGINX REVERSE PROXY & FIREWALL CONFIGURATION
# Configured for high-load DDoS protection, Rate Limiting, and WAF protection.
# ==============================================================================

# Rate Limiting Zone against DDoS
limit_req_zone $binary_remote_addr zone=nexus_limit:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=nexus_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name nexus-vr.io www.nexus-vr.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexus-vr.io www.nexus-vr.io;

    # SSL Configuration (TLS 1.3 only, high security ciphers)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com data: blob:;" always;
    add_header X-Proxy-Shield "Active-AES256-GCM" always;

    # Rate limiting application
    limit_req zone=nexus_limit burst=25 nodelay;
    limit_conn nexus_conn 20;

    root /var/www/nexus-vr;
    index index.html;

    # Block sensitive files
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Block SQLi / XSS probes
    if ($query_string ~* "(union.*select|insert.*into|drop.*table|<script|<iframe)") {
        return 403;
    }
}
